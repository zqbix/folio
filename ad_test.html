    <script>
        const Q=s=>document.querySelector(s);
        const A=(s,f)=>document.querySelectorAll(s).forEach(f);
        const on=(el,ev,f,o)=>el?.addEventListener(ev,f,o);
        const B=document.body.classList;
        const R=f=>requestAnimationFrame(()=>requestAnimationFrame(f));
        const AE=()=>document.activeElement;
        const DO='dialog-open';
        const M=Q('main');
        const PRM=matchMedia('(prefers-reduced-motion: reduce)');
        const triggerMap=new WeakMap();
        const open=(id,cb)=>{
            const d=Q('#'+id);
            if(!d)return;
            triggerMap.set(d,AE());
            AE()?.blur();
            d.showModal(),B.add(DO),M.inert=true,Q('#'+id+' h2').focus();
            PRM.matches
                ? (d.classList.add('is-open'),cb?.())
                : R(()=>(d.classList.add('is-open'),cb?.()));
            if(id==='dump'&&!d.dataset.loaded){
                typeof FOLIO_ITEMS!='undefined'
                    ?(d.querySelector('.folio-grid').innerHTML=FOLIO_ITEMS,d.dataset.loaded=1)
                    :d.querySelector('.folio-grid').textContent='FAILED TO LOAD';
            }
        };
        const close=id=>{
            const d=Q('#'+id),c=d?.classList,a=AE();
            if(!d?.open)return;
            Q('#'+id+' video')?.pause();
            d.contains(a)&&a.blur();
            const done=()=>{
                d.close();
                if(!Q('dialog[open]')){B.remove(DO);M.inert=false}
                const tr=triggerMap.get(d);
                if(tr&&(!tr.closest('dialog')||tr.closest('dialog')?.open)){
                    document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));
                    tr.focus();
                }
            };
            if(PRM.matches){c.remove('is-open');done();return}
            c.remove('is-open');
            // t is declared below but var-hoisted — intentional, do not reorder
            on(d,'transitionend',()=>{clearTimeout(t);done()},{once:1});
            var t=setTimeout(done,1100);
        };
        A('[data-open],[data-close]',b=>on(b,'click',()=>{const{open:o,close:c}=b.dataset;(o?open:close)(o||c)}));
        A('dialog',d=>{
            on(d,'click',e=>e.target===d&&close(d.id));
            d.oncancel=e=>{e.preventDefault();close(d.id)};
        });
        on(Q('#jump2gude'),'click',()=>open('gude',()=>close('info')));
        const em=Q('.email');                                                            // [+] cache element once
        const mh=()=>{em.href='mailto:'+em.dataset.user+'@'+em.dataset.domain};         // [+] shared handler — idempotent href assembly
        em&&(em.tabIndex=0);                                                             // [+] make focusable by keyboard — <a> without href is not in tab order
        on(em,'pointerover',mh,{once:true});                                             // [+] pointer devices
        on(em,'focus',mh,{once:true});                                                   // [+] keyboard navigation
        on(Q('#gude form'),'submit',async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('[type="submit"]'),p=btn.querySelector('.p');btn.disabled=true;p.textContent='SENDING..';try{const r=await fetch(f.action,{method:'POST',headers:{Accept:'application/json'},body:new FormData(f)});if(r.ok){f.reset();p.textContent='SENT'}else{btn.disabled=false;p.textContent='FAILED — RETRY'}}catch{btn.disabled=false;p.textContent='FAILED — RETRY'}}); // [+] async Formspree submit — stays on page, no navigation away
    </script>
