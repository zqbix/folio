    <script>
// ── DIALOG: OPEN ─────────────────────────────────────────────────────────────
const triggerMap = new WeakMap();

const open = id => {
    const dialog = document.querySelector('#' + id);
    if (!dialog) return;

    triggerMap.set(dialog, document.activeElement);
    document.activeElement?.blur();
    dialog.showModal();
    document.body.classList.add('dialog-open');
    document.querySelector('main').inert = true;
    document.querySelector('#' + id + ' h2').focus();

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        dialog.classList.add('is-open');
    } else {
        requestAnimationFrame(() => requestAnimationFrame(() => {
            dialog.classList.add('is-open');
        }));
    }

    if (id === 'dump' && !dialog.dataset.loaded) {
        if (typeof FOLIO_ITEMS != 'undefined') {
            dialog.querySelector('.folio-grid').innerHTML = FOLIO_ITEMS;
            dialog.dataset.loaded = 1;
        } else {
            dialog.querySelector('.folio-grid').textContent = 'FAILED TO LOAD';
        }
    }
};

// ── DIALOG: CLOSE ────────────────────────────────────────────────────────────
const close = id => {
    const dialog = document.querySelector('#' + id);
    if (!dialog?.open) return;

    document.querySelector('#' + id + ' video')?.pause();
    if (dialog.contains(document.activeElement)) document.activeElement.blur();

    const done = () => {
        dialog.close();
        if (!document.querySelector('dialog[open]')) {
            document.body.classList.remove('dialog-open');
            document.querySelector('main').inert = false;
        }
        const trigger = triggerMap.get(dialog);
        if (trigger && (!trigger.closest('dialog') || trigger.closest('dialog')?.open)) {
            trigger.focus();
        }
    };

    dialog.classList.remove('is-open');

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        done();
        return;
    }

    // t is var-hoisted intentionally — do not reorder
    const onEnd = e => { if (e.target !== dialog) return; clearTimeout(t); dialog.removeEventListener('transitionend', onEnd); done(); };
    dialog.addEventListener('transitionend', onEnd);
    var t = setTimeout(done, 1100);
};

// ── DIALOG: TRIGGERS (buttons + backdrop click + ESC) ────────────────────────
document.querySelectorAll('[data-open], [data-close]').forEach(button => {
    button.addEventListener('click', () => {
        if (button.dataset.open) {
            open(button.dataset.open);
        } else {
            close(button.dataset.close);
        }
    });
});

document.querySelectorAll('dialog').forEach(dialog => {
    dialog.addEventListener('click', event => {
        if (event.target === dialog) close(dialog.id);
    });
    dialog.oncancel = event => {
        event.preventDefault();
        close(dialog.id);
    };
});

// ── EMAIL: lazy href assembly (anti-scrape) ───────────────────────────────────
const emailLink = document.querySelector('.email');
if (emailLink) {
    emailLink.tabIndex = 0;
    emailLink.addEventListener('pointerover', () => {
        emailLink.href = 'mailto:' + emailLink.dataset.user + '@' + emailLink.dataset.domain;
    }, { once: true });
    emailLink.addEventListener('focus', () => {
        emailLink.href = 'mailto:' + emailLink.dataset.user + '@' + emailLink.dataset.domain;
    }, { once: true });
}
