		<style>
			:root {
				--clr-bg: hsl(0, 0%, 6%);
				--clr-gray: hsl(0, 0%, 8%);
				--clr-font-normal: hsl(0, 0%, 50%);
				--clr-font-hover: hsl(0, 0%, 100%);
				--trans-hover: 0.5s ease 0s;
				--ani-body: 1s cubic-bezier(1,0,1,1) 0s forwards;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html {
				background: var(--clr-bg);
				scroll-behavior: smooth;
			}
			body {
				text-align: center;
				animation: body var(--ani-body);
			}
			@keyframes body {
				0% { opacity: 0; }
				100% { opacity: 1; }
			}
			.flex-container {
				width: 100%;
				height: 100vh;
				height: 100dvh;
				display: flex;
				flex-flow: column nowrap;
				justify-content: flex-start;
				align-items: center;
			}
			.content {
				width: 100%;
				margin: 5px 0;
				padding: 5px 0;
				display: flex;
				flex-flow: row nowrap;
				justify-content: center;
				align-items: center;
				border-width: 0 10px;
				border-style: solid;
				border-color: transparent;
				background-color: var(--clr-bg);
				transition: border-color var(--trans-hover), background-color var(--trans-hover);
			}
			.content:hover {
				border-color: var(--clr-font-normal);
				background-color: var(--clr-gray);
			}
			.arial {
				font: normal normal 100 normal 15px/200% "Courier New";
				letter-spacing: 1px;
				word-spacing: 0px;
			}
			.normal {
				color: var(--clr-font-normal);
			}
			.red {
				color: hsl(330, 100%, 50%);
			}
			.green {
				color: hsl(160, 100%, 50%);
			}
			.left {
				width: 100%;
				text-align: right;
			}
			.center {
				width: auto;
				text-align: center;
			}
			.center::after {
				content: "\00A0 \2715 \00A0" ;
			}
			.right {
				width: 100%;
				text-align: left;
			}
			a {
				text-decoration: none;
				color: var(--clr-font-normal);
				transition: color var(--trans-hover);
			}
			a:hover {
				color: var(--clr-font-hover);
			}
		</style>
	</head>
