<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Image Picker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@200;300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1f1f1f;
    --border-mid: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #555;
    --text-mid: #888;
    --silvia: #c8a97e;
    --stefan: #7e9fc8;
    --danger: #c87e7e;
    --gone: #1a1a1a;
    --ok: #7ec8a0;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── LOADING SCREEN ── */
  .loading-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 300; gap: 16px;
    transition: opacity 0.3s;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .loading-error {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--danger);
    letter-spacing: 0.06em;
    max-width: 360px; text-align: center; line-height: 1.8;
    white-space: pre-line;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 1px solid var(--border-mid);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-weight: 300; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .turn-indicator { display: flex; align-items: center; gap: 10px; }
  .turn-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .turn-name {
    font-family: 'DM Mono', monospace;
    font-size: 13px; font-weight: 500; letter-spacing: 0.08em;
    transition: color 0.3s ease;
  }
  .turn-name.silvia { color: var(--silvia); }
  .turn-name.stefan { color: var(--stefan); }

  .header-tools { display: flex; gap: 8px; }
  .btn-tool {
    background: none;
    border: 1px solid var(--border-mid);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer; transition: all 0.2s;
  }
  .btn-tool:hover { border-color: var(--text-mid); color: var(--text-mid); }
  .btn-tool:disabled { opacity: 0.25; cursor: default; pointer-events: none; }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .status-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em;
  }
  .status-count span { color: var(--text); font-weight: 500; }
  .status-right { display: flex; align-items: center; gap: 20px; }
  .round-counter {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); transition: color 0.3s;
    min-width: 60px; text-align: right;
  }

  /* ── GRID ── */
  main { flex: 1; padding: 32px; overflow-y: auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 3px;
  }

  /* ── IMAGE CARD ── */
  .img-card {
    position: relative; aspect-ratio: 2/1;
    overflow: hidden; cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }
  .img-card:not(.removed):hover { border-color: #fff2; z-index: 2; }
  .img-card:not(.removed):hover .card-num { opacity: 1; }
  .img-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: brightness(0.85);
    transition: filter 0.2s, transform 0.3s ease;
  }
  .img-card:not(.removed):hover img { filter: brightness(1); transform: scale(1.03); }
  .card-num {
    position: absolute; bottom: 6px; right: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: #fff9; opacity: 0;
    letter-spacing: 0.08em; transition: opacity 0.2s;
    pointer-events: none;
  }

  /* ── REMOVED ── */
  .img-card.removed { cursor: default; pointer-events: none; }
  .img-card.removed img { filter: brightness(0) opacity(0); }
  .img-card.removed::after {
    content: '×'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--border-mid); background: var(--gone);
  }

  /* ── LAST ONE ── */
  .img-card.last-one {
    border-color: #fff3;
    animation: pulse-border 2s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%, 100% { border-color: #fff1; }
    50%       { border-color: #fff4; }
  }

  /* ── DIALOG ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .overlay.active { opacity: 1; pointer-events: all; }
  .dialog {
    background: var(--surface);
    border: 1px solid var(--border-mid);
    padding: 40px 48px;
    max-width: 440px; width: 90%;
    transform: translateY(8px); transition: transform 0.2s;
  }
  .overlay.active .dialog { transform: translateY(0); }
  .dialog-preview {
    width: 100%; aspect-ratio: 2/1; object-fit: cover; display: block;
    margin-bottom: 28px; filter: brightness(0.9);
  }
  .dialog-question {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-mid); margin-bottom: 8px;
  }
  .dialog-text {
    font-size: 16px; font-weight: 200; line-height: 1.6;
    color: var(--text); margin-bottom: 32px;
  }
  .dialog-text strong { font-weight: 400; }
  .dialog-actions { display: flex; gap: 10px; }
  .btn-confirm, .btn-cancel {
    flex: 1; padding: 13px 0; border: 1px solid; background: none;
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-confirm { border-color: var(--danger); color: var(--danger); }
  .btn-confirm:hover { background: var(--danger); color: var(--bg); }
  .btn-confirm:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .btn-cancel { border-color: var(--border-mid); color: var(--text-mid); }
  .btn-cancel:hover { border-color: var(--text-mid); color: var(--text); }

  /* ── FINISHED ── */
  .finished-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .finished-screen.active { opacity: 1; pointer-events: all; }
  .finished-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 20px;
  }
  .finished-img {
    width: min(480px, 90vw); aspect-ratio: 2/1; object-fit: cover;
    border: 1px solid var(--border-mid); margin-bottom: 24px;
  }
  .finished-title {
    font-size: 13px; font-weight: 200;
    color: var(--text-mid); font-family: 'DM Mono', monospace; letter-spacing: 0.08em;
  }
  .btn-reset {
    margin-top: 32px; background: none;
    border: 1px solid var(--border-mid); color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 10px 24px; cursor: pointer; transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--text-mid); color: var(--text-mid); }

  #import-input { display: none; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-mid); }
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loading-screen">
  <div class="spinner" id="loading-spinner"></div>
  <div class="loading-label" id="loading-label">Connecting …</div>
  <div class="loading-error" id="loading-error"></div>
</div>

<header>
  <div class="logo">Image Picker</div>
  <div class="turn-indicator">
    <span class="turn-label">Now:</span>
    <span class="turn-name" id="turn-name">Silvia</span>
  </div>
  <div class="header-tools">
    <button class="btn-tool" id="btn-export" onclick="exportState()">Export JSON</button>
    <button class="btn-tool" id="btn-import" onclick="document.getElementById('import-input').click()">Import JSON</button>
    <button class="btn-tool" id="btn-reset"  onclick="resetAll()">Reset</button>
  </div>
</header>

<div class="status-bar">
  <div class="status-count">
    <span id="remaining-count">—</span> remaining · <span id="removed-count">—</span> removed
  </div>
  <div class="status-right">
    <div class="round-counter" id="round-counter">—</div>
    <div class="sync-status"   id="sync-status">—</div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<!-- Confirm Dialog -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <img class="dialog-preview" id="dialog-img" src="" alt="">
    <div class="dialog-question">Confirm selection</div>
    <div class="dialog-text" id="dialog-text"></div>
    <div class="dialog-actions">
      <button class="btn-cancel"  onclick="closeDialog()">No, keep it</button>
      <button class="btn-confirm" id="btn-confirm" onclick="confirmRemove()">Yes, remove</button>
    </div>
  </div>
</div>

<!-- Finished Screen -->
<div class="finished-screen" id="finished-screen">
  <div class="finished-label">Last image remaining</div>
  <img class="finished-img" id="finished-img" src="" alt="">
  <div class="finished-title" id="finished-title"></div>
  <button class="btn-reset" onclick="resetAll()">Start over</button>
</div>

<input type="file" id="import-input" accept=".json" onchange="importState(event)">

<script>
// ── IMAGE LIST ────────────────────────────────────────────────
const ALL_IMAGES = [
  '0001','0002','0005','0007','0008','0009','0010',
  '0022','0023','0027','0029','0031','0032','0035',
  '0038','0042','0043','0044','0045','0046','0047',
  '0048','0049','0050','0051'
];
const IMAGE_DIR = './img/';

// ── JSONBIN CONFIG ────────────────────────────────────────────
const BIN_ID  = '6a0cbeee6610dd3ae870c18d';
const API_KEY = '$2a$10$klvy7teJl5AA2068laM8OO3hnCqYctpHkGuR4JRIL7vdyy98F4vCS';
// ─────────────────────────────────────────────────────────────

const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let state     = null;
let pendingId = null;
let saving    = false;

// ── HELPERS ───────────────────────────────────────────────────

function defaultState() {
  return { remaining: [...ALL_IMAGES], removed: [], turn: 'silvia', round: 1 };
}

function setSync(msg, color) {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.style.color = color || 'var(--text-dim)';
}

function lockUI(locked) {
  ['btn-export','btn-import','btn-reset','btn-confirm'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = locked;
  });
}

// ── JSONBIN ───────────────────────────────────────────────────

async function loadState() {
  try {
    const res = await fetch(BIN_URL + '/latest', {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rec  = data.record;
    if (rec && Array.isArray(rec.remaining)) {
      state = rec;
    } else {
      // Bin is empty on first run — write initial state
      state = defaultState();
      await saveState();
    }
  } catch(e) {
    document.getElementById('loading-spinner').style.display = 'none';
    document.getElementById('loading-label').style.display  = 'none';
    document.getElementById('loading-error').textContent =
      `Could not connect to JSONBin.\n\nCheck that BIN_ID and API_KEY are filled in correctly.\n\n(${e.message})`;
    console.error(e);
    return;
  }
  document.getElementById('loading-screen').classList.add('hidden');
  setSync('synced', 'var(--ok)');
  render();
}

async function saveState() {
  if (saving) return;
  saving = true;
  setSync('saving …');
  lockUI(true);
  try {
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setSync('synced', 'var(--ok)');
  } catch(e) {
    setSync('save failed!', 'var(--danger)');
    console.error(e);
  }
  lockUI(false);
  saving = false;
}

// ── EXPORT / IMPORT / RESET ───────────────────────────────────

function exportState() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'picker_state.json'; a.click();
  URL.revokeObjectURL(url);
}

function importState(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported.remaining && imported.turn) {
        state = imported;
        document.getElementById('finished-screen').classList.remove('active');
        await saveState();
        render();
      } else {
        alert('Invalid state file.');
      }
    } catch(err) { alert('Could not parse JSON.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

async function resetAll() {
  if (!confirm('Reset everything and start over?')) return;
  state = defaultState();
  document.getElementById('finished-screen').classList.remove('active');
  await saveState();
  render();
}

// ── RENDER ────────────────────────────────────────────────────

function render() {
  const grid       = document.getElementById('grid');
  grid.innerHTML   = '';
  const isFinished = state.remaining.length === 1;
  const lastId     = isFinished ? state.remaining[0] : null;

  ALL_IMAGES.forEach(id => {
    const isRemoved = !state.remaining.includes(id);
    const card = document.createElement('div');
    card.className = 'img-card' +
      (isRemoved ? ' removed' : '') +
      (id === lastId ? ' last-one' : '');

    const img = document.createElement('img');
    img.src = IMAGE_DIR + id + '.jpg';
    img.alt = id; img.loading = 'lazy';
    card.appendChild(img);

    if (!isRemoved) {
      const num = document.createElement('span');
      num.className = 'card-num';
      num.textContent = id;
      card.appendChild(num);
      card.addEventListener('click', () => openDialog(id));
    }
    grid.appendChild(card);
  });

  const turnNameEl = document.getElementById('turn-name');
  const name = state.turn === 'silvia' ? 'Silvia' : 'Stefan';
  turnNameEl.textContent = name;
  turnNameEl.className = 'turn-name ' + state.turn;

  document.getElementById('remaining-count').textContent = state.remaining.length;
  document.getElementById('removed-count').textContent   = state.removed.length;
  document.getElementById('round-counter').textContent   = 'Round ' + state.round;

  if (isFinished) setTimeout(() => showFinished(lastId), 400);
}

// ── DIALOG ───────────────────────────────────────────────────

function openDialog(id) {
  if (state.remaining.length === 1) return;
  pendingId = id;
  const name = state.turn === 'silvia' ? 'Silvia' : 'Stefan';
  document.getElementById('dialog-img').src = IMAGE_DIR + id + '.jpg';
  document.getElementById('dialog-text').innerHTML =
    `Are you <strong>${name}</strong> and do you really want to remove image <strong>${id}</strong>?`;
  document.getElementById('overlay').classList.add('active');
}

function closeDialog() {
  pendingId = null;
  document.getElementById('overlay').classList.remove('active');
}

async function confirmRemove() {
  if (!pendingId || saving) return;
  const id = pendingId;
  pendingId = null;
  document.getElementById('overlay').classList.remove('active');

  state.removed.push(id);
  state.remaining = state.remaining.filter(x => x !== id);
  state.turn  = state.turn === 'silvia' ? 'stefan' : 'silvia';
  state.round = Math.floor(state.removed.length / 2) + 1;

  render();           // update grid instantly, then push to server
  await saveState();

  if (state.remaining.length === 1) showFinished(state.remaining[0]);
}

function showFinished(id) {
  document.getElementById('finished-img').src = IMAGE_DIR + id + '.jpg';
  document.getElementById('finished-title').textContent = 'Image ' + id;
  document.getElementById('finished-screen').classList.add('active');
}

// ── KEYBOARD ─────────────────────────────────────────────────
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeDialog();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDialog();
  if (e.key === 'Enter' && pendingId && !saving) confirmRemove();
});

// ── BOOT ─────────────────────────────────────────────────────
loadState();
</script>
</body>
</html>
