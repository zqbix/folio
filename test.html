<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="css/test.css" />
</head>

<body>

  <!-- ============================================================
       VIEWPORT — the sliding panel container
       shifts left/right/up via body class to reveal sections
  ============================================================ -->
  <div class="viewport">

    <!-- HOME — default center position, holds nothing (nav sits above) -->
    <section id="home"></section>

    <!-- REEL — positioned left off-screen -->
    <section id="reel">
      <div class="stage stage--reel">
        <video
          class="video"
          poster="./reel/reel.jpg"
          preload="metadata"
          controls
          playsinline
          aria-label="VFX REEL"
        >
          <source src="./reel/reel.mp4" type="video/mp4">
          <p>YOUR BROWSER DOES NOT SUPPORT VIDEO</p>
        </video>
      </div>
    </section>

    <!-- INFO — positioned below off-screen -->
    <section id="info">
      <div class="stage stage--info">
        <p>CHRIS .. GERMANY NEAR FFM<br>.. 3D MODELING- AND FX-ARTIST<br>HOUDINI MAYA NUKE ..</p>
        <a href="#">link.to.some@imehl.com</a>
      </div>
    </section>

    <!-- DUMP — positioned right off-screen -->
    <section id="dump">
      <span>dump</span>
    </section>

  </div>
  <!-- /viewport -->


  <!-- ============================================================
       NAV — fixed, starts centered, docks to top on section open
  ============================================================ -->
  <nav>
    <button data-target="reel">reel</button>
    <button data-target="info">info</button>
    <button data-target="dump">dump</button>
  </nav>


  <!-- ============================================================
       SCRIPT
  ============================================================ -->
  <script>

    /* track the currently active section id, null = home */
    var current = null;

    /* cache video element once — used for pause-on-navigate */
    var vid = document.querySelector('.video');

    /* single click handler on nav via event delegation */
    document.querySelector('nav').addEventListener('click', function(e) {

      var btn = e.target;
      if (!btn.getAttribute) return;

      /* read target section id from data attribute */
      var id = btn.getAttribute('data-target');
      if (!id) return;

      var body    = document.body;
      var section = document.getElementById(id);

      /* always pause video before any transition fires */
      if (vid && !vid.paused) { vid.pause(); }

      /* clicking the active button returns everything to home */
      if (current === id) {
        body.className = body.className.replace(/\bshow-\S+/g, '').trim();
        current = null;
        return;
      }

      /* set body class to trigger CSS viewport shift + nav dock */
      body.className = body.className.replace(/\bshow-\S+/g, '').trim();
      body.className += (body.className ? ' ' : '') + 'show-' + id;

      /* flash: remove class → force reflow → re-add → remove after tick
         ::before transitions from bright back to base bg color         */
      section.className = section.className.replace(/\bflash\b/, '').trim();
      void section.offsetWidth;
      section.className += (section.className ? ' ' : '') + 'flash';
      setTimeout(function() {
        section.className = section.className.replace(/\bflash\b/, '').trim();
      }, 20);

      current = id;
    });

  </script>

</body>
</html>
