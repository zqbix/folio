<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>

    @font-face {
      font-family: federo;
      src: url(./font/federo.ttf);
      font-display: swap;
    }

    /* ─── reset ─────────────────────────────────────────────────────────────── */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── root ───────────────────────────────────────────────────────────────── */

    html {
      font-size: 16px;
      background: hsl(0, 0%, 7%);
    }

    body {
      width: 100%;
      height: 100%;
      text-align: center;
      overflow: hidden;
    }

    /* ─── main ───────────────────────────────────────────────────────────────── */

    /* position:fixed pins main to the viewport so document scroll can never shift it */
    main {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ─── header ───────────────────────────────────────────────────────────────── */

    main > header > h1 {
      font: italic 400 5rem/1 federo;
      letter-spacing: 0.5rem;
      color: hsl(0, 0%, 60%);
      cursor: default;
    }

    /* ─── nav ────────────────────────────────────────────────────────────────── */

    main > nav {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
    }

    main > nav > button {
      appearance: none;
      background: none;
      border: none;
      outline: none;
      padding: 0 5px;
      margin: 0 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font: italic 400 1rem/1 federo;
      text-transform: uppercase;
      letter-spacing: 0.3rem;
      color: hsl(0, 0%, 60%);
      transition: color 0.3s ease;
      cursor: pointer;
    }

    main > nav > button:hover,
    main > nav > button:focus {
      color: hsl(0, 0%, 100%);
    }

    /* ─── dialog ─────────────────────────────────────────────────────────────── */

    /* display:none when closed — prevents intercepting pointer events on the page */
    dialog {
      display: none;
      border: none;
      max-height: 100dvh;
      padding: 0;
      margin: auto;
      flex-direction: column;
      background: hsl(0, 0%, 7%);
      opacity: 0;
      transition: opacity 1s ease;
    }

    /* display:flex on open — opacity:0 holds it invisible until .is-visible is added */
    dialog[open] {
      display: flex;
      opacity: 0;
    }

    /* js adds .is-visible after showModal() to trigger the fade-in */
    dialog[open].is-visible {
      opacity: 1;
    }

    dialog::backdrop {
      background: hsl(0, 0%, 7%);
    }

    /* ─── dialog dimensions ──────────────────────────────────────────────────── */

    /* min() clamps width to viewport on small screens */
    dialog#reel { width: min(1280px, 100%); }
    dialog#info  { width: min(640px,  100%); }
    dialog#dump  { width: min(1280px, 100%); }

    /* ─── dialog bar ─────────────────────────────────────────────────────────── */

    /* top bar — matches nav height for visual consistency */
    dialog > div {
      width: 100%;
      height: 55px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
    }

    /* h2 title sits on the left — unstyled to match nav weight */
    dialog > div > h2 {
      font: italic 400 1rem/1 federo;
      text-transform: uppercase;
      letter-spacing: 0.3rem;
      color: hsl(0, 0%, 60%);
      cursor: default;
    }

    /* close button sits on the right */
    dialog > div > button {
      appearance: none;
      background: none;
      border: none;
      outline: none;
      padding: 0 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font: italic 400 1.5rem/1 federo;
      color: hsl(0, 0%, 60%);
      cursor: pointer;
      transition: color 0.3s ease;
    }

    dialog > div > button:hover,
    dialog > div > button:focus {
      color: hsl(0, 0%, 100%);
    }

    /* ─── dialog content ─────────────────────────────────────────────────────── */

    /* height is driven by content — overflow:hidden clips any accidental bleed */
    dialog > section.reel {
      width: 100%;
      overflow: hidden;
    }

    /* ─── video ──────────────────────────────────────────────────────────────── */

    /* max-height subtracts the bar so the video never overflows the viewport */
    dialog > section.reel > video {
      width: 100%;
      max-height: calc(100dvh - 55px);
      aspect-ratio: 16/9;
    }

    dialog > section.reel > video > p {
      font: italic 400 1rem/1 federo;
      text-transform: uppercase;
      letter-spacing: 0.3rem;
      color: hsl(0, 0%, 60%);
    }

    dialog > section.info {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    dialog > section.info > p {
      font: italic 400 1rem/1.2 federo;
      text-transform: uppercase;
      letter-spacing: 0.2rem;
      color: hsl(0, 0%, 60%);
    }

    dialog > section.info > a {
      margin: 25px 0 5px;
      font: italic 400 1rem/1 federo;
      letter-spacing: 0.1rem;
      color: hsl(0, 0%, 60%);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    dialog > section.info > a:hover,
    dialog > section.info > a:active {
      color: hsl(0, 0%, 100%);
    }

    dialog > section.info > a::before {
      content: attr(data-user)
    }

    dialog > section.info > a::after {
      content: "@" attr(data-domain)
    }

  </style>
</head>

<body>

  <!-- ─── main ─────────────────────────────────────────────────────────────── -->

  <main>
    <header>
      <h1>zqbix</h1>
    </header>
    <nav>
      <button>reel</button>
      <button>info</button>
      <button>dump</button>
    </nav>
  </main>

  <!-- ─── dialogs ──────────────────────────────────────────────────────────── -->

  <dialog id="reel">
    <div>
      <h2>reel</h2>
      <button>&#10005;</button>
    </div>
    <section class="reel">
      <video poster="./reel/reel.jpg" preload="metadata" controls playsinline aria-label="VFX REEL">
        <source src="./reel/reel.mp4" type="video/mp4">
        <p>your browser does not support video</p>
      </video>
    </section>
  </dialog>

  <dialog id="info">
    <div>
      <h2>info</h2>
      <button>&#10005;</button>
    </div>
    <section class="info">
      <p>chris..germany near ffm<br>..3d modeling- and fx-artist<br>houdini maya nuke..</p>
      <a data-user="zqbix" data-domain="protonmail.com" aria-label="SEND EMAIL" role="link"></a>
    </section>
  </dialog>

  <dialog id="dump">
    <div>
      <h2>dump</h2>
      <button>&#10005;</button>
    </div>
    <section class="dump">
      <!-- dump content -->
    </section>
  </dialog>

  <!-- ─── scripts ──────────────────────────────────────────────────────────── -->

  <script>

    // ── event listeners ────────────────────────────────────────────────────────

    // nav buttons — dialog id is derived from button text content
    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => openDialog(btn.textContent.trim()));
    });

    // close buttons — dialog id is derived from closest parent dialog element
    document.querySelectorAll('dialog div button').forEach(btn => {
      btn.addEventListener('click', () => {
        closeDialog(btn.closest('dialog').id);
      });
    });

    // ESC key — intercepted and rerouted through closeDialog so fade-out plays
    document.querySelectorAll('dialog').forEach(dialog => {
      dialog.addEventListener('cancel', e => {
        e.preventDefault();
        closeDialog(dialog.id);
      });
    });

    // ── functions ──────────────────────────────────────────────────────────────

    function openDialog(id) {
      const dialog = document.getElementById(id);
      dialog.showModal();
      // blur the auto-focused close button so it doesn't appear highlighted on open
      dialog.querySelector('div button').blur();
      // double rAF ensures the transition fires after display:flex is painted
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          dialog.classList.add('is-visible');
        });
      });
    }

    function closeDialog(id) {
      const dialog = document.getElementById(id);
      dialog.classList.remove('is-visible');
      // pause any playing media before the dialog closes
      dialog.querySelectorAll('video, audio').forEach(media => media.pause());
      // duration is read from CSS so JS stays in sync if the value ever changes
      const duration = parseFloat(getComputedStyle(dialog).transitionDuration) * 1000;
      setTimeout(() => {
        dialog.close();
        // clear any lingering focus state on nav buttons
        document.activeElement.blur();
      }, duration);
    }

    const emailLink = document.querySelector('dialog section a');
    if (emailLink) {
        emailLink.tabIndex = 0;
        emailLink.addEventListener('pointerover', () => {
            emailLink.href = 'mailto:' + emailLink.dataset.user + '@' + emailLink.dataset.domain;
        }, { once: true });
        emailLink.addEventListener('focus', () => {
            emailLink.href = 'mailto:' + emailLink.dataset.user + '@' + emailLink.dataset.domain;
        }, { once: true });
    }

  </script>

</body>
</html>
