<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>

    @font-face {
      font-family: federo;
      src: url(./font/federo.ttf);
      font-display: swap;
    }

    /* ─── reset ─────────────────────────────────────────────────────────────── */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── root ───────────────────────────────────────────────────────────────── */

    html {
      font-size: 16px;
      background: hsl(0, 0%, 7%);
    }

    body {
      width: 100%;
      height: 100%;
      text-align: center;
      overflow: hidden;
    }

    /* ─── main ───────────────────────────────────────────────────────────────── */

    /* position:fixed pins main to the viewport so document scroll can never shift it */
    main {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ─── header ───────────────────────────────────────────────────────────────── */

    header h1 {
      font: italic 400 5rem/1 federo;
      letter-spacing: 0.5rem;
      color: hsl(0, 0%, 60%);
      cursor: default;
    }

    /* ─── nav ────────────────────────────────────────────────────────────────── */

    nav {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
    }

    nav button {
      appearance: none;
      background: none;
      border: none;
      outline: none;
      padding: 0 5px;
      margin: 0 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font: italic 400 1rem/1 federo;
      text-transform: uppercase;
      letter-spacing: 0.3rem;
      color: hsl(0, 0%, 60%);
      transition: color 0.3s ease;
      cursor: pointer;
    }

    nav button:hover,
    nav button:focus {
      color: hsl(0, 0%, 100%);
    }

    /* ─── dialog ─────────────────────────────────────────────────────────────── */

    /* display:none when closed — prevents intercepting pointer events on the page */
    dialog {
      display: none;
      background: hsl(0, 0%, 7%);
      color: hsl(0, 0%, 60%);
      font-family: monospace;
      border: none;
      padding: 0;
      margin: auto;
      max-height: 100dvh;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* display:flex on open — opacity:0 holds it invisible until .is-visible is added */
    dialog[open] {
      display: flex;
      opacity: 0;
    }

    /* js adds .is-visible after showModal() to trigger the fade-in */
    dialog[open].is-visible {
      opacity: 1;
    }

    dialog::backdrop {
      background: hsl(0, 0%, 7%);
    }

    /* ─── dialog dimensions ──────────────────────────────────────────────────── */

    /* min() clamps width to viewport on small screens */
    dialog#reel { width: min(1280px, 100%); }
    dialog#info  { width: min(960px,  100%); }
    dialog#dump  { width: min(1280px, 100%); }

    /* ─── dialog bar ─────────────────────────────────────────────────────────── */

    /* top bar — matches nav height for visual consistency */
    .dialog-bar {
      width: 100%;
      height: 55px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
    }

    /* h2 title sits on the left — unstyled to match nav weight */
    .dialog-bar h2 {
      font-size: 1rem;
      font-weight: normal;
    }

    /* close button sits on the right */
    .dialog-bar button[class="dialog-close"] {
      appearance: none;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 1rem;
      color: hsl(0, 0%, 60%);
      font-family: monospace;
      padding: 0 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: color 0.3s ease;
    }

    .dialog-bar button[class="dialog-close"]:hover,
    .dialog-bar button[class="dialog-close"]:focus {
      color: hsl(0, 0%, 100%);
    }

    /* ─── dialog content ─────────────────────────────────────────────────────── */

    /* height is driven by content — overflow:hidden clips any accidental bleed */
    .dialog-content {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ─── video ──────────────────────────────────────────────────────────────── */

    /* max-height subtracts the bar so the video never overflows the viewport */
    .video {
      width: 100%;
      max-height: calc(100dvh - 55px);
      aspect-ratio: 16/9;
    }

  </style>
</head>

<body>

  <!-- ─── main ─────────────────────────────────────────────────────────────── -->

  <main>
    <header>
      <h1>zqbix</h1>
    </header>
    <nav>
      <button>reel</button>
      <button>info</button>
      <button>dump</button>
    </nav>
  </main>

  <!-- ─── dialogs ──────────────────────────────────────────────────────────── -->

  <dialog id="reel">
    <div class="dialog-bar">
      <h2>reel</h2>
      <button class="dialog-close">&#10005;</button>
    </div>
    <div class="dialog-content">
      <video class="video" poster="./reel/reel.jpg" preload="metadata" controls playsinline aria-label="VFX REEL">
        <source src="./reel/reel.mp4" type="video/mp4">
        <p>YOUR BROWSER DOES NOT SUPPORT VIDEO</p>
      </video>
    </div>
  </dialog>

  <dialog id="info">
    <div class="dialog-bar">
      <h2>info</h2>
      <button class="dialog-close">&#10005;</button>
    </div>
    <div class="dialog-content">
      <!-- info content -->
    </div>
  </dialog>

  <dialog id="dump">
    <div class="dialog-bar">
      <h2>dump</h2>
      <button class="dialog-close">&#10005;</button>
    </div>
    <div class="dialog-content">
      <!-- dump content -->
    </div>
  </dialog>

  <!-- ─── scripts ──────────────────────────────────────────────────────────── -->

  <script>

    // ── event listeners ────────────────────────────────────────────────────────

    // nav buttons — dialog id is derived from button text content
    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => openDialog(btn.textContent.trim()));
    });

    // close buttons — dialog id is derived from closest parent dialog element
    document.querySelectorAll('.dialog-close').forEach(btn => {
      btn.addEventListener('click', () => {
        closeDialog(btn.closest('dialog').id);
      });
    });

    // ESC key — intercepted and rerouted through closeDialog so fade-out plays
    document.querySelectorAll('dialog').forEach(dialog => {
      dialog.addEventListener('cancel', e => {
        e.preventDefault();
        closeDialog(dialog.id);
      });
    });

    // ── functions ──────────────────────────────────────────────────────────────

    function openDialog(id) {
      const dialog = document.getElementById(id);
      dialog.showModal();
      // blur the auto-focused close button so it doesn't appear highlighted on open
      dialog.querySelector('.dialog-close').blur();
      // double rAF ensures the transition fires after display:flex is painted
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          dialog.classList.add('is-visible');
        });
      });
    }

    function closeDialog(id) {
      const dialog = document.getElementById(id);
      dialog.classList.remove('is-visible');
      // pause any playing media before the dialog closes
      dialog.querySelectorAll('video, audio').forEach(media => media.pause());
      // duration is read from CSS so JS stays in sync if the value ever changes
      const duration = parseFloat(getComputedStyle(dialog).transitionDuration) * 1000;
      setTimeout(() => {
        dialog.close();
        // clear any lingering focus state on nav buttons
        document.activeElement.blur();
      }, duration);
    }

  </script>

</body>
</html>
