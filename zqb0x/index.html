  <title>z q b 0 x b y z q b 1 x</title>
  <style>
    :root {
      --clr-07: hsl(0, 0%, 7%);
      --clr-30: hsl(0, 0%, 30%);
      --clr-60: hsl(0, 0%, 60%);
      --clr-90: hsl(0, 0%, 90%);
      --clr-ok: hsl(140, 40%, 55%);
      --clr-err: hsl(0, 60%, 55%);
      --transition-ui: 0.3s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }

      html,
      body {
        min-height: 100%;
        background: var(--clr-07);

        main {
          height: 100svh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow-x: hidden;

          section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            button {
              width: 100%;
              background-color: transparent;
              color: inherit;
              border: none;
              padding: 0;
              border-radius: 0;
              box-shadow: none;
              text-align: left;
              font: inherit;
              text-decoration: none;
              cursor: pointer;
              user-select: none;
              animation: fade-btn 1s ease both;
              animation-delay: calc(var(--delay) * 0.04s);

              &:first-of-type,
              &:last-of-type {
                padding: 2rem 0;
              }

              &:hover,
              &:active,
              &:focus {
                text-decoration: none;
                outline: none;
              }

              > span {
                font: 400 1rem/1 monospace;
                letter-spacing: 0.5rem;
                transition: color var(--transition-ui);

                &:nth-child(1) {
                  color: var(--clr-30);
                }

                &:nth-child(2) {
                  color: var(--clr-60);
                }
              }

              &:hover > span,
              &:focus > span,
              &:active > span {
                color: var(--clr-90);
              }

              &.is-copied > span {
                color: var(--clr-ok);
              }

              &.is-error > span {
                color: var(--clr-err);
              }
            }
          }
        }
      }

    @keyframes fade-btn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.7);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <button type="button" style="--delay: 18;"><span>zq</span><span>b0x</span></button>
      <button type="button" style="--delay: 13;" data-nk="zqchromaticaberration"><span>zq</span><span>chr om a ti ca b err ati on</span></button>
      <button type="button" style="--delay: 9;"  data-nk="zqdetailnormals"><span>zq</span><span> det ai l nor ma ls</span></button>
      <button type="button" style="--delay: 11;" data-nk="zqedgedistort"><span>zq</span><span>ed ge d i sto r t</span></button>
      <button type="button" style="--delay: 6;"  data-nk="zqfakecrypto"><span>zq</span><span> fak e cr yp t o</span></button>
      <button type="button" style="--delay: 9;"  data-nk="zqfakemotion"><span>zq</span><span>fa ke mot i on</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqgrain"><span>zq</span><span> g ra in</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqhalation"><span>zq</span><span>h a l ati on</span></button>
      <button type="button" style="--delay: 6;"  data-nk="zqlightwrapluma"><span>zq</span><span>lig tw rap l um a</span></button>
      <button type="button" style="--delay: 3;"  data-nk="zqlightwrapunified"><span>zq</span><span> li gh tw ra pun if i ed</span></button>
      <button type="button" style="--delay: 3;"  data-nk="zqnormaldeband"><span>zq</span><span>nor mal d eban d</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqnormalfalloff"><span>zq</span><span>n o r mal fall of f</span></button>
      <button type="button" style="--delay: 0;"  data-nk="zqpositionfalloff"><span>zq</span><span> po sit ion fa llo ff</span></button>
      <button type="button" style="--delay: 2;"  data-nk="zqvanishingpointguide"><span>zq</span><span> v anis hi ngp oi nt gu i d e</span></button>
      <button type="button" style="--delay: 0;"  data-nk="zqvignette"><span>zq</span><span>vi gn ett e</span></button>
      <button type="button" style="--delay: 3;"><span>by</span><span>zqbix</span></button>
    </section>
  </main>

  <script>
    const FEEDBACK_MS = 1200;
    const flashTimers = new WeakMap();

    function flash(btn, className) {
      btn.classList.remove('is-copied', 'is-error');
      void btn.offsetWidth;
      btn.classList.add(className);

      clearTimeout(flashTimers.get(btn));

      flashTimers.set(
        btn,
        setTimeout(() => {
          btn.classList.remove(className);
          flashTimers.delete(btn);
        }, FEEDBACK_MS)
      );
    }

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-nk]');
      if (!btn || btn.disabled) return;

      const { nk } = btn.dataset;

      btn.disabled = true;

      try {
        if (!navigator.clipboard?.writeText) {
          throw new Error('Clipboard API unavailable');
        }

        const response = await fetch(`./nk/${encodeURIComponent(nk)}.nk`);

        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }

        const text = await response.text();
        await navigator.clipboard.writeText(text);

        flash(btn, 'is-copied');
      } catch (error) {
        console.error(`Could not copy ${nk}.nk:`, error);
        flash(btn, 'is-error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
