<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; font-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'" />
  <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color"  content="#121212" />
  <meta name="robots"       content="noindex, nofollow" />
  <meta name="referrer"     content="no-referrer" />
  <meta name="author"       content="zqbix" />
  <link rel="icon"             href="../../img/favicon.svg"          type="image/svg+xml" />
  <link rel="icon"             href="../../img/favicon.png"          type="image/png" />
  <link rel="apple-touch-icon" href="../../img/apple-touch-icon.png" sizes="180x180" />
  <title>zq.b0x.by.zqb1x</title>
  <style>
    :root {
      --clr-07:  hsl(0, 0%, 7%);
      --clr-30:  hsl(0, 0%, 30%);
      --clr-60:  hsl(0, 0%, 60%);
      --clr-90:  hsl(0, 0%, 90%);
      --clr-ok:  hsl(140, 40%, 55%);
      --clr-err: hsl(0, 60%, 55%);
      --transition-ui: 0.3s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    html, body {
      width: 100%;
      background: var(--clr-07);
    }

    main {
      position: fixed;
      overflow-x: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      user-select: none;
    }

    section {
      width: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      background-color: transparent;
      color: inherit;
      border: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      text-align: left;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      animation: fade-btn 1s ease both;
      animation-delay: calc(var(--delay) * 0.04s);

      &:first-of-type {
        padding: 1rem 0;
      }

      &:hover,
      &:active,
      &:focus {
        text-decoration: none;
        outline: none;
      }

      > span {
        font: 400 1rem/1 monospace;
        letter-spacing: 0.5rem;
        transition: color var(--transition-ui);

        &:nth-child(1) { color: var(--clr-30); }
        &:nth-child(2) { color: var(--clr-60); }
      }

      &:hover > span,
      &:focus > span,
      &:active > span {
        color: var(--clr-90);
      }

      &.is-copied > span { color: var(--clr-ok); }
      &.is-error  > span { color: var(--clr-err); }
    }

    @keyframes fade-btn {
      from { opacity: 0; transform: translateY(40px) scale(0.7); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <button type="button" style="--delay: 18;"><span>zq</span><span>b0x</span></button>
      <button type="button" style="--delay: 13;" data-nk="zqchromaticaberration"><span>zq</span><span>chromaticaberration</span></button>
      <button type="button" style="--delay: 9;"  data-nk="zqdetailnormals"><span>zq</span><span>detailnormals</span></button>
      <button type="button" style="--delay: 11;" data-nk="zqedgedistort"><span>zq</span><span>edgedistort</span></button>
      <button type="button" style="--delay: 6;"  data-nk="zqfakecrypto"><span>zq</span><span>fakecrypto</span></button>
      <button type="button" style="--delay: 9;"  data-nk="zqfakemotion"><span>zq</span><span>fakemotion</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqgrain"><span>zq</span><span>grain</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqhalation"><span>zq</span><span>halation</span></button>
      <button type="button" style="--delay: 6;"  data-nk="zqlightwrapluma"><span>zq</span><span>lightwrapluma</span></button>
      <button type="button" style="--delay: 3;"  data-nk="zqlightwrapunified"><span>zq</span><span>lightwrapunified</span></button>
      <button type="button" style="--delay: 3;"  data-nk="zqnormaldeband"><span>zq</span><span>normaldeband</span></button>
      <button type="button" style="--delay: 4;"  data-nk="zqnormalfalloff"><span>zq</span><span>normalfalloff</span></button>
      <button type="button" style="--delay: 0;"  data-nk="zqpositionfalloff"><span>zq</span><span>positionfalloff</span></button>
      <button type="button" style="--delay: 2;"  data-nk="zqvanishingpointguide"><span>zq</span><span>vanishingpointguide</span></button>
      <button type="button" style="--delay: 0;"  data-nk="zqvignette"><span>zq</span><span>vignette</span></button>
    </section>
  </main>

  <script>
    const FEEDBACK_MS = 1200;

    function flash(btn, className) {
      btn.classList.remove('is-copied', 'is-error');
      void btn.offsetWidth; // restart animation if re-triggered mid-flash
      btn.classList.add(className);
      setTimeout(() => btn.classList.remove(className), FEEDBACK_MS);
    }

    document.querySelectorAll('button[data-nk]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          const res = await fetch(`./nk/${btn.dataset.nk}.nk`);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          await navigator.clipboard.writeText(await res.text());
          flash(btn, 'is-copied');
        } catch (err) {
          console.error(`Could not copy ${btn.dataset.nk}.nk:`, err);
          flash(btn, 'is-error');
        }
      });
    });
  </script>
</body>
</html>
