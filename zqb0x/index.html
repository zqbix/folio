    button:hover,

    }
    button:hover > span:nth-child(1),
    button:focus > span:nth-child(1),

    }
    :popover-open {

  <script>
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    document.querySelectorAll('[popover]').forEach((el) => {
      el.addEventListener('beforetoggle', async (event) => {
        if (event.newState !== 'open' || el.dataset.loaded) return;

        const pre = el.querySelector('pre');
        const file = `./nk/${el.id}.nk`;

        try {
          const res = await fetch(file);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const raw = await res.text();
          pre.innerHTML = escapeHtml(raw);
          el.dataset.loaded = 'true';
        } catch (err) {
          pre.textContent = `Could not load ${file}: ${err.message}`;
        }
      });
    });
  </script>
